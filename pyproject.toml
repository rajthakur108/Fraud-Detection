[project]
name = "fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection MLOps project"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.14.0",
    "numpy>=1.26.0,<2",
    "pandas>=2.2.0,<3",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "protobuf<5.28",
    "xgboost>=2.1.0",
    "imbalanced-learn>=0.12.0",
    "hyperopt>=0.2.7",
    "optuna>=4.0.0",
    "nbconvert>=7.0.0",
    "pydantic<2",
    "griffe==0.36.9",
    "prefect==2.20.2",
    "anyio>=4.4,<4.14",
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "evidently==0.6.7",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
