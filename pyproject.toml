[project]
name = "fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection MLOps project"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.14.0",
    "numpy>=1.26.0,<2",
    "pandas>=2.2.0,<3",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "protobuf<5.28",
    "xgboost>=2.1.0",
    "imbalanced-learn>=0.12.0",
    "hyperopt>=0.2.7",
    "optuna>=4.0.0",
    "nbconvert>=7.0.0",
    "pydantic<2",
    "griffe==0.36.9",
    "prefect==2.20.2",
    "anyio>=4.4,<4.14",
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "evidently==0.6.7",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
]

[tool.pylint.messages_control]

disable = [
    "missing-function-docstring",
    "missing-module-docstring",
    "redefined-outer-name",
    "missing-timeout",
    "chained-comparison",
    "duplicate-code",
    "line-too-long",
    "invalid-name",
    "unused-argument",
    "unused-variable",
    "unused-import",
    "too-many-positional-arguments",
    "too-many-arguments",
    "too-many-locals",
    "no-value-for-parameter",
    "inconsistent-return-statements",
    "f-string-without-interpolation",
    "no-else-return",
]

[tool.isort]
profile = "black"
line_length = 88
